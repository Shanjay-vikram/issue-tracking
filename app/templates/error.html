{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel"><div class="empty"><strong>{{ code }} · {{ title }}</strong>{{ message }}<div class="mt-3"><a class="btn btn-primary btn-sm" href="{{ url_for('main.dashboard') }}">Back to dashboard</a></div></div></div>
{% endblock %}
{% block public %}
<div class="container py-5" style="max-width:560px"><div class="panel"><div class="empty"><strong>{{ code }} · {{ title }}</strong>{{ message }}<div class="mt-3"><a class="btn btn-primary btn-sm" href="{{ url_for('auth.login') }}">Go to sign in</a></div></div></div></div>
{% endblock %}

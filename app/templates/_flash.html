{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}<div class="flash-stack" role="status">
    {% for cat, msg in messages %}<div class="alert alert-{{ cat if cat in ('success','danger','warning','info') else 'info' }} mb-2">{{ msg }}</div>{% endfor %}
  </div>{% endif %}
{% endwith %}
